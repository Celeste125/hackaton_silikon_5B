model_version: imdl_cow_yolov8_v1
artifact: cow_yolov8.pt
architecture: YOLOv8  # n or s, whichever was trained
task: detection
input_size: 640
classes:
  0: cow_head
  1: cow_body
landmark: cow_enclosure  # both classes map to it in config/landmarks.yaml
default_inference:
  confidence_threshold: 0.35
dataset:
  frames: 170  # 2 fps from 6 indoor videos, 42 empty negatives
  split: {train: 136, val: 34}
  labeling: bounding boxes, reviewed and corrected in CVAT
  cow_head: head incl. ears/horns, down to the jaw
  cow_body: visible torso and legs, head excluded
evaluation:
  val_map50: TODO  # from the training notebook, cell 5
  val_map50_95: TODO
notes:
  - Val frames come from the same videos as training frames, so the val score is optimistic.
  - Checked on one unseen video at conf 0.35; Jetson latency not yet measured.
