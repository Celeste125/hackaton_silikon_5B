# What the landmark model is allowed to put on the map.
#
# This file is the contract with whoever trains the model. The keys are the
# landmark names the rest of the system uses; model_classes are the class
# names the weights were trained with, and they are matched case- and
# separator-insensitively, so 'Food Dispenser', 'food-dispenser' and
# 'food_dispenser' all match. A class the model emits that no landmark claims
# is ignored, with one log line.
#
# Both landmark_detector (perception) and landmark_mapper (imdl_autonomy) read
# this file. Keep them pointed at the same copy, or they will disagree about
# which detections exist.
#
# bearing_sigma_deg is the one number worth thinking about. It is how far the
# box centre is expected to be from the object's true centre, as an angle, and
# it sets how much each view is trusted in the fusion. Guidance:
#
#   2-3 deg   a compact object the model boxes tightly and completely
#   5-8 deg   something large, or usually only partly in frame: the centroid
#             of the visible part is not the centroid of the object, and it
#             moves between views
#
# Too small a value makes the fusion overconfident and the published
# covariance a lie; too large only makes it converge more slowly.

landmarks:

  # The only landmark on this branch. The model has two classes, cow_head and
  # cow_body, and both are claimed here: a head poking out of a box and a
  # body half hidden behind one are equally a sighting of the cows, and the
  # mapper fuses every such view into one position. They are not split into
  # two landmarks because the mapper estimates one point per landmark; a
  # separate cow_head landmark would just be the same place counted twice.
  cow_enclosure:
    model_classes: [cow_head, cow_body]
    # The model was checked on unseen video at 0.35. Raise this if
    # /landmarks/state shows views_rejected climbing from false positives.
    min_confidence: 0.35
    # Several cows stand at different spots in the enclosure, and a frame
    # often shows only part of one, so the box centroid wanders a good
    # fraction of the enclosure width from view to view.
    bearing_sigma_deg: 7.0
    # Depth inside a cow box lands on the cutout, the box behind it or the
    # fence, so a range from it is worth little.
    range_sigma_m: 0.40
    color: [0.95, 0.6, 0.1]
    marker_scale_m: 0.35
    note: >-
      Where the cows are kept: paper cow cutouts mounted on and behind
      cardboard boxes, detected by head and/or body.
