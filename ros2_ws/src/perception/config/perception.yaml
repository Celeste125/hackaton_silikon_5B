yolo_segmentation:
  ros__parameters:
    model_path: ''
    image_topic: '/camera/camera/color/image_raw'
    detections_topic: '/yolo/detections'
    debug_image_topic: '/yolo/debug_image'
    debug_compressed_image_topic: '/yolo/debug_image/compressed'
    debug_jpeg_quality: 75
    confidence_threshold: 0.35
    iou_threshold: 0.70
    image_size: 640
    device: '0'
    max_inference_rate_hz: 10.0
    publish_debug_image: false

target_pose_estimator:
  ros__parameters:
    detections_topic: '/yolo/detections'
    aligned_depth_topic: '/camera/camera/aligned_depth_to_color/image_raw'
    camera_info_topic: '/camera/camera/aligned_depth_to_color/camera_info'
    typed_objects_topic: '/perception/detected_objects'
    target_frame: 'map'
    base_frame: 'base_link'
    min_depth_m: 0.05
    max_depth_m: 3.0
    depth_outlier_threshold_m: 0.10
    min_mask_area_px: 25
    min_mask_depth_pixels: 20
    min_valid_depth_ratio: 0.25
    max_depth_mad_m: 0.04
    depth_sync_tolerance_sec: 0.15
    min_corner_mask_area_px: 40
    min_rect_fill_ratio: 0.45

target_selector:
  ros__parameters:
    typed_objects_topic: '/perception/detected_objects'
    current_target_topic: '/current_target_object'
    target_pose_topic: '/target_block_pose'
    requested_class_topic: '/requested_target_class'
    target_class: ''
    target_color_sequence: 'red_block,yellow_block,green_block,blue_block'
    min_target_confidence: 0.35
    stale_timeout_sec: 0.5
    selection_rate_hz: 10.0
    target_frame: 'map'

perception_visualizer:
  ros__parameters:
    debug_image_topic: '/yolo/debug_image'
    aligned_depth_topic: '/camera/camera/aligned_depth_to_color/image_raw'
    typed_objects_topic: '/perception/detected_objects'
    fused_debug_topic: '/perception/fused_debug/compressed'
    markers_topic: '/perception/object_markers'
    map_frame: 'map'
    min_depth_m: 0.05
    max_depth_m: 3.0
    sync_tolerance_sec: 0.20
    buffer_size: 20
    jpeg_quality: 75
    publish_fused_debug: true
    publish_markers: true
    show_map_coordinates: false

beacon_heading_controller:
  ros__parameters:
    target_pose_topic: '/target_block_pose'
    command_topic: '/beacon_cmd'
    base_frame: 'base_link'
    publish_rate_hz: 10.0
    stale_timeout_sec: 1.0
