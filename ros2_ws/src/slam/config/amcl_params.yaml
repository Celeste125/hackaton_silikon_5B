amcl:
  ros__parameters:
    use_sim_time: false

    # Particle filter parameters.
    min_particles: 500
    max_particles: 2000
    kld_err: 0.05
    kld_z: 0.99

    # Motion model parameters for odometry.
    alpha1: 0.2   # Rotational noise from rotation.
    alpha2: 0.2   # Rotational noise from translation.
    alpha3: 0.2   # Translational noise from translation.
    alpha4: 0.2   # Translational noise from rotation.
    alpha5: 0.1

    # Laser model parameters.
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.15
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5

    # Frames.
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"

    # Update rate control.
    update_min_d: 0.1      # Update after moving 10 cm.
    update_min_a: 0.2      # Update after rotating 0.2 rad.
    resample_interval: 1

    # Initial pose, starting at the origin.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # Publication settings.
    transform_tolerance: 1.0
    tf_broadcast: true
